<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hank's Bar &mdash; Music</title>
<style>
  :root {
    --bg: #14100e;
    --panel: #221b16;
    --accent: #e0a458;
    --text: #f3ede7;
    --muted: #a2917f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding-bottom: 6.5rem; /* keep results clear of the now-playing bar */
  }
  header { text-align: center; padding: 2rem 1rem 0.5rem; }
  header h1 { color: var(--accent); letter-spacing: 0.12em; font-size: 1.7rem; }
  header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; }

  .search { display: flex; gap: 0.5rem; max-width: 34rem; margin: 1.2rem auto; padding: 0 1rem; }
  .search input {
    flex: 1; min-width: 0;
    padding: 0.75rem 1rem;
    border-radius: 0.6rem;
    border: 1px solid #3c3128;
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .search button {
    padding: 0.75rem 1.3rem;
    border: none; border-radius: 0.6rem;
    background: var(--accent); color: #221600;
    font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .search button:active { transform: scale(0.97); }

  #message { max-width: 34rem; margin: 0 auto 0.8rem; padding: 0 1rem; color: var(--muted); font-size: 0.95rem; text-align: center; }
  #message.error { color: #e07358; }

  #results { max-width: 34rem; margin: 0 auto; padding: 0 1rem; }
  .track {
    display: flex; align-items: center; gap: 0.8rem;
    background: var(--panel);
    border-radius: 0.6rem;
    padding: 0.6rem 0.7rem;
    margin-bottom: 0.5rem;
  }
  .track img { width: 48px; height: 48px; border-radius: 0.35rem; background: #000; flex-shrink: 0; }
  .track .art-fallback {
    width: 48px; height: 48px; border-radius: 0.35rem; flex-shrink: 0;
    background: #3c3128; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.3rem;
  }
  .track .info { flex: 1; min-width: 0; }
  .track .info .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .info .artist { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track button {
    padding: 0.5rem 1rem;
    border: 1px solid var(--accent); border-radius: 2rem;
    background: transparent; color: var(--accent);
    font-size: 0.9rem; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
  }
  .track button:active { background: var(--accent); color: #221600; }

  #nowbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 0.8rem;
    background: var(--panel);
    border-top: 2px solid var(--accent);
    padding: 0.65rem 1rem;
  }
  #nowbar img { width: 44px; height: 44px; border-radius: 0.35rem; background: #000; }
  #nowbar .info { flex: 1; min-width: 0; }
  #nowbar .info .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowbar .info .artist { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowbar button {
    width: 3rem; height: 3rem;
    border: none; border-radius: 50%;
    background: var(--accent); color: #221600;
    font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
  }
  #nowbar input[type=range] { width: 5.5rem; accent-color: var(--accent); flex-shrink: 0; }

  .track .actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
  .track .actions button.queue { border-color: var(--muted); color: var(--muted); }

  .panel { max-width: 34rem; margin: 0 auto 0.8rem; padding: 0 1rem; }
  .panel .box { background: var(--panel); border-radius: 0.6rem; padding: 0.7rem 0.9rem; }
  .panel h2 { font-size: 0.8rem; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
  #queueList { list-style: none; }
  #queueList li { padding: 0.25rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #queueList li span { color: var(--muted); font-size: 0.85rem; }
  .row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .pill {
    padding: 0.5rem 1rem;
    border: 1px solid var(--accent); border-radius: 2rem;
    background: transparent; color: var(--accent);
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .pill.on { background: var(--accent); color: #221600; }
  .pill:active { transform: scale(0.97); }
  #danceInfo { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
  <header>
    <h1>HANK&rsquo;S BAR</h1>
    <p>Pick a song &mdash; the robot approves.</p>
  </header>

  <form class="search" id="searchForm">
    <input id="searchInput" type="search" placeholder="Search Spotify..." autocomplete="off">
    <button type="submit">Search</button>
  </form>

  <div id="message"></div>

  <div class="panel" id="queuePanel" hidden>
    <div class="box">
      <h2>UP NEXT</h2>
      <ol id="queueList"></ol>
      <div class="row" style="margin-top:0.4rem">
        <button class="pill" id="skipBtn">Skip &#9654;&#9654;</button>
      </div>
    </div>
  </div>

  <div class="panel" id="dancePanel" hidden>
    <div class="box row">
      <button class="pill" id="danceBtn">&#128378; Dance</button>
      <button class="pill" id="tapBtn" title="Tap 4+ times on the beat">Tap tempo</button>
      <span id="danceInfo"></span>
    </div>
  </div>

  <div id="results"></div>

  <div id="nowbar" hidden>
    <img id="nowArt" alt="">
    <div class="info">
      <div class="name" id="nowName"></div>
      <div class="artist" id="nowArtist"></div>
    </div>
    <input id="volume" type="range" min="0" max="100" step="5" title="Volume">
    <button id="playPause" title="Play/Pause">&#10074;&#10074;</button>
  </div>

<script>
  const messageEl = document.getElementById("message");
  const resultsEl = document.getElementById("results");
  const nowbar = document.getElementById("nowbar");
  const volumeEl = document.getElementById("volume");
  let isPlaying = false;
  let volumeDragging = false;

  function showMessage(text, isError) {
    messageEl.textContent = text || "";
    messageEl.classList.toggle("error", !!isError);
  }

  // Hardened: a non-JSON error page (proxy, crash) gives a readable message
  // instead of a cryptic JSON parse error.
  async function api(path, options) {
    const res = await fetch(path, options);
    let data;
    try {
      data = await res.json();
    } catch (e) {
      throw new Error(`Server error (${res.status})`);
    }
    if (!res.ok || data.error) throw new Error(data.error || `Server error (${res.status})`);
    return data.result;
  }

  function post(path, body) {
    return api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
  }

  document.getElementById("searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = document.getElementById("searchInput").value.trim();
    if (!q) return;
    showMessage("Searching...");
    resultsEl.innerHTML = "";
    try {
      const tracks = await api("/search?q=" + encodeURIComponent(q));
      showMessage(tracks.length ? "" : "No songs found.");
      for (const t of tracks) resultsEl.appendChild(trackRow(t));
    } catch (err) {
      showMessage(err.message, true);
    }
  });

  function actionButton(label, cls, fn) {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (cls) btn.className = cls;
    btn.addEventListener("click", async () => {
      btn.textContent = "...";
      try {
        await fn();
        showMessage("");
      } catch (err) {
        showMessage(err.message, true);
      }
      btn.textContent = label;
    });
    return btn;
  }

  function trackRow(t) {
    const row = document.createElement("div");
    row.className = "track";

    if (t.album_art) {
      const img = document.createElement("img");
      img.src = t.album_art;
      img.alt = "";
      row.appendChild(img);
    } else {
      const fallback = document.createElement("div");
      fallback.className = "art-fallback";
      fallback.textContent = "♫";
      row.appendChild(fallback);
    }

    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = t.name;
    const artist = document.createElement("div");
    artist.className = "artist";
    artist.textContent = t.artist;
    info.append(name, artist);
    row.appendChild(info);

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.appendChild(actionButton("Play", "", async () => {
      await post("/play", t);
      refreshStatus();
    }));
    actions.appendChild(actionButton("+ Queue", "queue", async () => {
      await post("/queue", t);
      showMessage(`Queued: ${t.name}`);
      refreshQueue();
      refreshStatus();
    }));
    row.appendChild(actions);
    return row;
  }

  document.getElementById("playPause").addEventListener("click", async () => {
    try {
      await api(isPlaying ? "/pause" : "/resume", { method: "POST" });
      refreshStatus();
    } catch (err) {
      showMessage(err.message, true);
    }
  });

  // ---- volume
  volumeEl.addEventListener("input", () => { volumeDragging = true; });
  volumeEl.addEventListener("change", async () => {
    volumeDragging = false;
    try {
      await post("/volume", { percent: Number(volumeEl.value) });
    } catch (err) {
      showMessage(err.message, true);
    }
  });

  // ---- queue
  document.getElementById("skipBtn").addEventListener("click", async () => {
    try {
      await api("/skip", { method: "POST" });
      refreshQueue();
      refreshStatus();
    } catch (err) {
      showMessage(err.message, true);
    }
  });

  async function refreshQueue() {
    try {
      const q = await api("/queue");
      const list = document.getElementById("queueList");
      list.innerHTML = "";
      for (const t of q) {
        const li = document.createElement("li");
        li.textContent = t.name + " ";
        const by = document.createElement("span");
        by.textContent = t.artist;
        li.appendChild(by);
        list.appendChild(li);
      }
      document.getElementById("queuePanel").hidden = q.length === 0;
    } catch (err) {
      // quiet on polls
    }
  }

  // ---- dance + tap tempo
  const danceBtn = document.getElementById("danceBtn");
  const danceInfo = document.getElementById("danceInfo");
  let danceOn = false;
  let taps = [];

  function showDance(d) {
    danceOn = d.on;
    danceBtn.classList.toggle("on", d.on);
    if (!d.on) danceInfo.textContent = "";
    else if (d.bpm) danceInfo.textContent = `${Math.round(d.bpm)} BPM${d.dancing ? "" : " (waiting for music)"}`;
    else danceInfo.textContent = "finding the beat… tap it if this sticks";
  }

  danceBtn.addEventListener("click", async () => {
    try {
      showDance(await post("/dance", { on: !danceOn }));
    } catch (err) {
      showMessage(err.message, true);
    }
  });

  document.getElementById("tapBtn").addEventListener("click", async () => {
    const now = performance.now();
    taps = taps.filter((t) => now - t < 3000);     // forget taps older than 3 s
    taps.push(now);
    if (taps.length < 4) {
      danceInfo.textContent = `tap ${4 - taps.length} more…`;
      return;
    }
    const gaps = taps.slice(1).map((t, i) => t - taps[i]);
    const bpm = 60000 / (gaps.reduce((a, b) => a + b, 0) / gaps.length);
    try {
      showDance(await post("/dance", { on: true, bpm: Math.round(bpm * 10) / 10 }));
    } catch (err) {
      showMessage(err.message, true);
    }
  });

  async function refreshDance() {
    try {
      const d = await api("/dance");
      document.getElementById("dancePanel").hidden = !d.available;
      if (d.available) showDance(d);
    } catch (err) {
      // quiet on polls
    }
  }

  async function refreshStatus() {
    try {
      const now = await api("/status");
      if (!now) { nowbar.hidden = true; return; }
      nowbar.hidden = false;
      document.getElementById("nowName").textContent = now.name;
      document.getElementById("nowArtist").textContent = now.artist;
      document.getElementById("nowArt").src = now.album_art || "";
      isPlaying = now.is_playing;
      document.getElementById("playPause").innerHTML = isPlaying ? "&#10074;&#10074;" : "&#9654;";
      if (now.volume != null && !volumeDragging) volumeEl.value = now.volume;
    } catch (err) {
      // stay quiet on status polls; the bar just won't update
    }
  }

  function refreshAll() {
    refreshStatus();
    refreshQueue();
    refreshDance();
  }

  refreshAll();
  setInterval(refreshAll, 5000);
</script>
</body>
</html>
